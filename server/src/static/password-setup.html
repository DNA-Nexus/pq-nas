<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-t="title">Password setup</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #172554, #020617 65%);
      color: #e5e7eb;
    }
    .card {
      width: min(92vw, 560px);
      border: 1px solid rgba(148,163,184,.35);
      border-radius: 22px;
      padding: 28px;
      background: rgba(15,23,42,.88);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display:block; margin: 16px 0 8px; font-weight: 650; }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(148,163,184,.45);
      border-radius: 12px;
      background: rgba(15,23,42,.7);
      color: #f8fafc;
      font: inherit;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 14px;
      border: 0;
      border-radius: 12px;
      background: #38bdf8;
      color: #082f49;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status {
      min-height: 1.5em;
      margin-top: 16px;
      color: #bfdbfe;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #fecaca; }
    .ok { color: #bbf7d0; }
    .warn {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(251,191,36,.35);
      color: #fde68a;
      background: rgba(120,53,15,.28);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1 data-t="heading">Set your account password</h1>
    <p data-t="intro">
      Choose your password. After setup succeeds, your DNA recovery words are shown once.
      Store them safely. The server does not store them.
    </p>

    <form id="form">
      <label for="password" data-t="password_label">Password, min 12 characters</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>

      <label for="confirm" data-t="confirm_label">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>

      <button id="submit" type="submit" data-t="submit">Create my account</button>
    </form>

    <div id="status" class="status"></div>

    <div id="recoveryBox" class="hidden">
      <div class="warn" data-t="recovery_warning">
        Recovery words are shown once. Copy them now. Anyone with these words can recover this DNA identity.
      </div>
      <label for="recovery" data-t="recovery_label">Recovery words</label>
      <textarea id="recovery" readonly></textarea>
    </div>
  </main>

    const params = new URLSearchParams(location.search);

    function normalizeLanguage(raw) {
      const v = String(raw || "").trim().toLowerCase().replace("_", "-");
      const aliases = {
        "zh-cn": "zh",
        "zh-hans": "zh",
        "uk-ua": "uk",
        "de-de": "de",
        "et-ee": "et",
        "pl-pl": "pl",
        "es-es": "es",
        "fr-fr": "fr",
        "it-it": "it",
        "tr-tr": "tr"
      };
      const aliased = aliases[v] || v;
      const base = aliased.split("-")[0];
      return I18N[aliased] ? aliased : (I18N[base] ? base : "en");
    }

    let storedLang = "";
    try { storedLang = localStorage.getItem("pqnas_lang") || ""; } catch (_) {}

    const lang = normalizeLanguage(
      params.get("lang") ||
      storedLang ||
      navigator.language ||
      "en"
    );

    document.documentElement.lang = lang;

    function t(key, vars = null) {
      let out = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
      if (vars) {
        for (const [k, v] of Object.entries(vars)) {
          out = out.replaceAll(`{${k}}`, String(v));
        }
      }
      return out;
    }

    document.querySelectorAll("[data-t]").forEach((el) => {
      const key = el.getAttribute("data-t");
      const value = t(key);
      if (el.tagName === "TITLE") {
        document.title = value;
      } else {
        el.textContent = value;
      }
    });

    const token = (params.get("token") || "").trim();

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const passwordEl = document.getElementById("password");
    const confirmEl = document.getElementById("confirm");
    const recoveryBox = document.getElementById("recoveryBox");
    const recoveryEl = document.getElementById("recovery");

    function setStatus(message, cls = "") {
      statusEl.className = "status " + cls;
      statusEl.textContent = message;
    }

    if (!token) {
      setStatus(t("missing_token"), "error");
      submit.disabled = true;
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      const password = passwordEl.value;
      const confirm = confirmEl.value;

      if (password.length < 12) {
        setStatus(t("too_short"), "error");
        return;
      }

      if (password !== confirm) {
        setStatus(t("mismatch"), "error");
        return;
      }

      submit.disabled = true;

      try {
        setStatus(t("creating"));

        const res = await fetch("/api/auth/password/setup-finish", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json().catch(() => null);

        passwordEl.value = "";
        confirmEl.value = "";

        if (!res.ok || !data || data.ok !== true) {
          const msg = data && (data.message || data.error)
            ? (data.message || data.error)
            : `HTTP ${res.status}`;
          throw new Error(msg);
        }

        form.classList.add("hidden");
        recoveryEl.value = data.recovery_words || "";
        recoveryBox.classList.remove("hidden");
        recoveryEl.focus();
        recoveryEl.select();

        setStatus(
          `${t("created")}\n${t("login")}: ${data.login || ""}\n${t("fingerprint")}: ${data.fingerprint || ""}`,
          "ok"
        );
      } catch (err) {
        setStatus(t("failed", { error: err && err.message ? err.message : String(err) }), "error");
        submit.disabled = false;
      }
    });
