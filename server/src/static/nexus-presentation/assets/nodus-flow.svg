<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Nodus media flow diagram</title><desc id="desc">Nodus carries federation events while media is served from the origin NAS.</desc>
<defs><linearGradient id="nas" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#28d7ff"/><stop offset="1" stop-color="#8affc1"/></linearGradient><linearGradient id="nodus" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff9f1c"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs>
<rect width="900" height="620" rx="42" fill="#0a1629"/>
<g font-family="Arial" text-anchor="middle">
<rect x="75" y="155" width="220" height="180" rx="30" fill="#101f36" stroke="url(#nas)" stroke-width="5"/><text x="185" y="215" fill="#eef7ff" font-size="30" font-weight="900">Your NAS</text><text x="185" y="258" fill="#9fb5cb" font-size="21">original media</text><rect x="138" y="278" width="94" height="36" rx="18" fill="#28d7ff"/><text x="185" y="302" fill="#06111d" font-size="18" font-weight="900">photo.jpg</text>
<circle cx="450" cy="245" r="88" fill="#101f36" stroke="url(#nodus)" stroke-width="5"/><text x="450" y="236" fill="#eef7ff" font-size="34" font-weight="900">Nodus</text><text x="450" y="273" fill="#9fb5cb" font-size="20">small event</text>
<rect x="605" y="155" width="220" height="180" rx="30" fill="#101f36" stroke="#ff6b8a" stroke-width="5"/><text x="715" y="215" fill="#eef7ff" font-size="30" font-weight="900">Friend NAS</text><text x="715" y="258" fill="#9fb5cb" font-size="21">sees post</text><rect x="668" y="278" width="94" height="36" rx="18" fill="#ff6b8a"/><text x="715" y="302" fill="#06111d" font-size="18" font-weight="900">preview</text>
</g>
<path d="M295 232h65" stroke="#ffd166" stroke-width="9" stroke-linecap="round"/><path d="M340 207l31 25-31 25" fill="none" stroke="#ffd166" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M538 232h65" stroke="#ffd166" stroke-width="9" stroke-linecap="round"/><path d="M583 207l31 25-31 25" fill="none" stroke="#ffd166" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
