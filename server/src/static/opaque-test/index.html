<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PQ-NAS OPAQUE WASM Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1, h2 { color: #f8fafc; }
    section {
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      background: #111827;
    }
    label {
      display: block;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 14px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #020617;
      color: #e5e7eb;
      font-size: 15px;
    }
    button {
      margin-top: 16px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #475569; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 14px;
      border-radius: 10px;
      background: #020617;
      border: 1px solid #334155;
      color: #d1fae5;
      min-height: 80px;
    }
    .warn { color: #fbbf24; }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <h1>PQ-NAS OPAQUE WASM Test</h1>
  <p class="muted">
    Test-only page for browser-side Rust/WASM OPAQUE login and bootstrap flows.
  </p>

  <section>
    <h2>1. Existing OPAQUE login</h2>

    <label>Login</label>
    <input id="login" value="timo@example.com" autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginBtn">Run full OPAQUE login</button>

    <pre id="loginOut">Waiting...</pre>
  </section>

  <section>
    <h2>2. First OPAQUE admin bootstrap</h2>
    <p class="warn">
      This only works on a fresh install with no enabled admin and with PQNAS_OPAQUE_BOOTSTRAP_TOKEN set.
    </p>

    <label>Bootstrap token</label>
    <input id="bootstrapToken" autocomplete="off">

    <label>Admin login / email</label>
    <input id="bootstrapLogin" value="admin@example.com" autocomplete="username">

    <label>Admin display name</label>
    <input id="bootstrapName" value="Admin">

    <label>New OPAQUE password</label>
    <input id="bootstrapPassword" type="password" autocomplete="new-password">

    <button id="bootstrapBtn">Create first OPAQUE admin</button>

    <pre id="bootstrapOut">Waiting...</pre>
  </section>

  <script type="module">
    import init, {
      opaqueLoginStart,
      opaqueLoginFinish,
      opaqueRegistrationStart,
      opaqueRegistrationFinish
    } from "./pqnas_opaque_browser_client.js";

    let wasmReady = false;

    async function ensureWasm() {
      if (!wasmReady) {
        await init("./pqnas_opaque_browser_client_bg.wasm");
        wasmReady = true;
      }
    }

    function pretty(x) {
      return JSON.stringify(x, null, 2);
    }

    async function postJson(url, body, extraHeaders = {}) {
      const res = await fetch(url, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          ...extraHeaders
        },
        body: JSON.stringify(body)
      });

      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch {
        json = { ok: false, raw: text };
      }

      if (!res.ok) {
        throw new Error(`${url} failed: HTTP ${res.status} ${pretty(json)}`);
      }

      return json;
    }

    async function runLogin() {
      const out = document.getElementById("loginOut");
      const passwordInput = document.getElementById("password");

      try {
        out.textContent = "1/4 Loading WASM...";
        await ensureWasm();

        const login = document.getElementById("login").value.trim();
        const password = passwordInput.value;

        out.textContent = "2/4 Browser opaqueLoginStart...";
        const clientStart = JSON.parse(opaqueLoginStart(password));

        out.textContent = "3/4 Server /api/auth/opaque/login/start...";
        const serverStart = await postJson("/api/auth/opaque/login/start", {
          login,
          credential_request_b64: clientStart.credential_request_b64
        });

        out.textContent = "4/4 Browser opaqueLoginFinish + server finish...";
        const clientFinish = JSON.parse(opaqueLoginFinish(
          password,
          clientStart.client_login_state_b64,
          serverStart.credential_response_b64
        ));

        const serverFinish = await postJson("/api/auth/opaque/login/finish", {
          opaque_login_id: serverStart.opaque_login_id,
          credential_finalization_b64: clientFinish.credential_finalization_b64
        });

        passwordInput.value = "";

        out.textContent = pretty({
          ok: true,
          clientStart: {
            ok: clientStart.ok,
            client_login_state_b64_len: clientStart.client_login_state_b64.length,
            credential_request_b64_len: clientStart.credential_request_b64.length
          },
          serverStart,
          clientFinish: {
            ok: clientFinish.ok,
            credential_finalization_b64_len: clientFinish.credential_finalization_b64.length,
            client_session_key_bytes: clientFinish.client_session_key_bytes
          },
          serverFinish
        });
      } catch (err) {
        passwordInput.value = "";
        out.textContent = String(err && err.stack ? err.stack : err);
      }
    }

    async function runBootstrap() {
      const out = document.getElementById("bootstrapOut");
      const passwordInput = document.getElementById("bootstrapPassword");

      try {
        out.textContent = "1/4 Loading WASM...";
        await ensureWasm();

        const bootstrap_token = document.getElementById("bootstrapToken").value.trim();
        const login = document.getElementById("bootstrapLogin").value.trim();
        const name = document.getElementById("bootstrapName").value.trim();
        const password = passwordInput.value;

        out.textContent = "2/4 Browser opaqueRegistrationStart...";
        const clientStart = JSON.parse(opaqueRegistrationStart(password));

        out.textContent = "3/4 Server /api/auth/opaque/bootstrap-admin/start...";
        const serverStart = await postJson(
          "/api/auth/opaque/bootstrap-admin/start",
          {
            bootstrap_token,
            login,
            registration_request_b64: clientStart.registration_request_b64
          },
          { "X-PQNAS-Bootstrap-Token": bootstrap_token }
        );

        out.textContent = "4/4 Browser opaqueRegistrationFinish + server finish...";
        const clientFinish = JSON.parse(opaqueRegistrationFinish(
          password,
          clientStart.client_registration_state_b64,
          serverStart.registration_response_b64
        ));

        const serverFinish = await postJson(
          "/api/auth/opaque/bootstrap-admin/finish",
          {
            bootstrap_token,
            login,
            name,
            registration_upload_b64: clientFinish.registration_upload_b64
          },
          { "X-PQNAS-Bootstrap-Token": bootstrap_token }
        );

        passwordInput.value = "";

        out.textContent = pretty({
          ok: true,
          clientStart: {
            ok: clientStart.ok,
            client_registration_state_b64_len: clientStart.client_registration_state_b64.length,
            registration_request_b64_len: clientStart.registration_request_b64.length
          },
          serverStart,
          clientFinish: {
            ok: clientFinish.ok,
            registration_upload_b64_len: clientFinish.registration_upload_b64.length
          },
          serverFinish
        });
      } catch (err) {
        passwordInput.value = "";
        out.textContent = String(err && err.stack ? err.stack : err);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", runLogin);
    document.getElementById("bootstrapBtn").addEventListener("click", runBootstrap);
  </script>
</body>
</html>
