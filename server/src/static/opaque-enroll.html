<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="opaque_enroll.page_title">DNA-Nexus OPAQUE setup</title>
  <script src="/static/i18n.js?v=20260614-opaque-enroll-i18n-1"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #172554, #020617 65%);
      color: #e5e7eb;
    }
    .card {
      width: min(92vw, 480px);
      border: 1px solid rgba(148,163,184,.35);
      border-radius: 22px;
      padding: 28px;
      background: rgba(15,23,42,.88);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display:block; margin: 18px 0 8px; font-weight: 650; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(148,163,184,.45);
      border-radius: 12px;
      background: rgba(15,23,42,.7);
      color: #f8fafc;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 14px;
      border: 0;
      border-radius: 12px;
      background: #38bdf8;
      color: #082f49;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status {
      min-height: 1.5em;
      margin-top: 16px;
      color: #bfdbfe;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #fecaca; }
    .ok { color: #bbf7d0; }
    .small { font-size: .9rem; color: #94a3b8; }
    .postSetupActions { margin-top: 16px; display: grid; gap: 10px; }
    .postSetupActions[hidden] { display: none; }
    .postSetupActions a {
      display: block;
      text-align: center;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 0;
      padding: 13px 14px;
      border: 0;
      border-radius: 12px;
      background: #38bdf8;
      color: #082f49;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 data-i18n="opaque_enroll.heading">Set your DNA-Nexus password</h1>
    <p data-i18n="opaque_enroll.intro">This page uses OPAQUE zero-knowledge password setup. Your password is processed in this browser and is not sent to the server.</p>

    <form id="form">
      <label for="password" data-i18n="opaque_enroll.new_password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>

      <label for="confirm" data-i18n="opaque_enroll.confirm_password">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>

      <button id="submit" type="submit" data-i18n="opaque_enroll.submit">Set password</button>
    </form>

    <div id="status" class="status"></div>
    <div id="postSetupActions" class="postSetupActions" hidden>
      <a id="continueAfterSetup" href="/static/login.html">Sign in</a>
    </div>
    <p class="small" data-i18n="opaque_enroll.link_single_use">The setup link is single-use. If it has expired, ask an administrator for a new link.</p>
  </main>

  <script type="module">
    const OPAQUE_CLIENT_MODULE_URL = "/static/opaque/pqnas_opaque_browser_client.js?v=20260613-opaque-enroll-1";
    const OPAQUE_CLIENT_WASM_URL = "/static/opaque/pqnas_opaque_browser_client_bg.wasm?v=20260613-opaque-enroll-1";

    const params = new URLSearchParams(location.search);
    const token = (params.get("token") || "").trim();
    const setupLang = (params.get("lang") || "").trim();

    function safeReturnTo(raw) {
      const value = String(raw || "").trim();
      if (!value) return "";
      if (!value.startsWith("/")) return "";
      if (value.startsWith("//")) return "";
      if (value.includes("\n") || value.includes("\r")) return "";
      if (!value.startsWith("/static/external_workspace.html?")) return "";
      return value;
    }

    const returnTo = safeReturnTo(params.get("return_to") || "");


    async function initLanguage() {
      if (!window.PQNAS_I18N) return;
      if (setupLang) {
        await window.PQNAS_I18N.setLanguage(setupLang, { persist: false });
        return;
      }
      await window.PQNAS_I18N.ready();
    }

    function t(key, fallback, vars = null) {
      if (window.PQNAS_I18N && typeof window.PQNAS_I18N.t === "function") {
        return window.PQNAS_I18N.t(key, vars, fallback);
      }
      let out = String(fallback || "");
      if (vars && typeof vars === "object") {
        for (const [k, v] of Object.entries(vars)) {
          out = out.replaceAll(`{${k}}`, String(v ?? ""));
        }
      }
      return out;
    }

    await initLanguage();

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const passwordEl = document.getElementById("password");
    const confirmEl = document.getElementById("confirm");
    const postSetupActions = document.getElementById("postSetupActions");
    const continueAfterSetup = document.getElementById("continueAfterSetup");

    function setStatus(message, cls = "") {
      statusEl.className = "status " + cls;
      statusEl.textContent = message;
    }

    function loginUrlWithReturnTo() {
      if (!returnTo) return "/static/login.html";
      return "/static/login.html?return_to=" + encodeURIComponent(returnTo);
    }

    function showPostSetupActions() {
      if (!postSetupActions || !continueAfterSetup) return;
      continueAfterSetup.href = loginUrlWithReturnTo();
      continueAfterSetup.textContent = returnTo
        ? "Sign in and open shared space"
        : "Sign in";
      postSetupActions.hidden = false;
    }

    function parseOpaqueResult(value) {
      if (typeof value === "string") return JSON.parse(value);
      if (value && typeof value === "object") return value;
      throw new Error("Unexpected OPAQUE client result");
    }

    async function loadOpaqueClient() {
      const mod = await import(OPAQUE_CLIENT_MODULE_URL);
      if (typeof mod.default === "function") {
        await mod.default(OPAQUE_CLIENT_WASM_URL);
      }
      if (typeof mod.opaqueRegistrationStart !== "function" ||
          typeof mod.opaqueRegistrationFinish !== "function") {
        throw new Error("OPAQUE registration functions missing");
      }
      return mod;
    }

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify(body)
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok || !data || data.ok !== true) {
        const msg = data && (data.message || data.error) ? (data.message || data.error) : `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return data;
    }

    if (!token) {
      submit.disabled = true;
      setStatus(t("opaque_enroll.missing_token", "Missing setup token."), "error");
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      const password = passwordEl.value;
      const confirm = confirmEl.value;

      if (password.length < 12) {
        setStatus(t("opaque_enroll.password_min", "Password must be at least 12 characters."), "error");
        return;
      }
      if (password !== confirm) {
        setStatus(t("opaque_enroll.password_mismatch", "Passwords do not match."), "error");
        return;
      }

      submit.disabled = true;

      try {
        setStatus(t("opaque_enroll.loading_client", "Loading OPAQUE client..."));
        const opaque = await loadOpaqueClient();

        setStatus(t("opaque_enroll.creating_request", "Creating registration request in browser..."));
        const regStart = parseOpaqueResult(await opaque.opaqueRegistrationStart(password));
        if (!regStart.ok || !regStart.client_registration_state_b64 || !regStart.registration_request_b64) {
          throw new Error(t("opaque_enroll.opaque_start_failed", "OPAQUE registration start failed"));
        }

        setStatus(t("opaque_enroll.contacting_server", "Contacting server..."));
        const serverStart = await postJson("/api/auth/opaque/enrollment/start", {
          token,
          registration_request_b64: regStart.registration_request_b64
        });

        setStatus(t("opaque_enroll.finalizing", "Finalizing registration in browser..."));
        const regFinish = parseOpaqueResult(await opaque.opaqueRegistrationFinish(
          password,
          regStart.client_registration_state_b64,
          serverStart.registration_response_b64
        ));

        if (!regFinish.ok || !regFinish.registration_upload_b64) {
          throw new Error(t("opaque_enroll.opaque_finish_failed", "OPAQUE registration finish failed"));
        }

        setStatus(t("opaque_enroll.saving", "Saving credential..."));
        const done = await postJson("/api/auth/opaque/enrollment/finish", {
          token,
          registration_upload_b64: regFinish.registration_upload_b64
        });

        passwordEl.value = "";
        confirmEl.value = "";

        const readyLine = t(
          "opaque_enroll.success_ready",
          "Password set. You can now sign in as {login}.",
          { login: done.login || "" }
        );
        const pendingLine = t(
          "opaque_enroll.success_pending",
          "Password set, but the account is not enabled yet. Ask an administrator to enable it."
        );

        if (done.recovery_words) {
          const loginLine = done.ready_for_login ? readyLine : pendingLine;
          setStatus(
            `${loginLine}\n\n${t("opaque_enroll.recovery_title", "Recovery words — shown once:")}\n${done.recovery_words}\n\n${t("opaque_enroll.recovery_note", "Copy these 24 words now and store them safely. They cannot be shown again.")}`,
            "ok"
          );
        } else if (done.ready_for_login) {
          setStatus(readyLine, "ok");
        } else {
          setStatus(pendingLine, "ok");
        }

        if (done.ready_for_login) {
          showPostSetupActions();
        }
      } catch (err) {
        setStatus(
          t("opaque_enroll.setup_failed", "Setup failed: {message}", {
            message: err && err.message ? err.message : String(err)
          }),
          "error"
        );
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
