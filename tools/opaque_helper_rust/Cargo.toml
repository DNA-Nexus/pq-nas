[package]
name = "pqnas_opaque_helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
# Exact pins by policy: do not float OPAQUE crypto dependency versions.
opaque-ke = { version = "=4.1.0-pre.0", features = ["argon2", "ristretto255"] }
rand = { version = "=0.8.6", features = ["getrandom"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
