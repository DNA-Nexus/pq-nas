<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Circle Stack</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="memory_nodes.css?v=20260523-svgicon1">
  <link rel="stylesheet" href="brand_logo.css?v=20260523-brandlogo1">
</head>
<body>
  <main class="cs-shell">
    <header class="cs-header">
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.tagline"></p>
    </header>

    <section class="cs-compose">
      <textarea id="csText" data-i18n-placeholder="compose.placeholder"></textarea>
      <div class="cs-media-row">
        <input id="csMediaPath" data-i18n-placeholder="compose.mediaPath">
        <button id="csPickMedia" type="button">Browse</button>
      </div>
      <div id="csMediaPreview" class="cs-media-preview" hidden></div>

      <div id="csVisibility" class="cs-visibility" data-value="public">
        <button type="button" class="cs-vis-option is-active" data-value="public">🌍 Public</button>
        <button type="button" class="cs-vis-option" data-value="private">🔒 Private</button>
        <button type="button" class="cs-vis-option" data-value="circle">👥 Circle</button>
      </div>

      <div id="csCircleUsers" class="cs-circle-users" hidden></div>

      <div id="csMentionComposer" class="cs-mention-composer">
        <div id="csMentionChips" class="cs-mention-chips"></div>
        <button id="csAddMentionBtn" type="button">Tag friend</button>
      </div>

      <button id="csPostButton" data-i18n="compose.post"></button>
    </section>

    <div class="cs-intro-toolbar">
  <button id="csFeedModeBtn" type="button" class="is-active" title="Cycle feed mode">Mode: Feed</button>
  <button id="csIntroduceBtn" type="button">Introduce people</button>
  <button id="csMyCircleBtn" type="button">My Circle</button>
  <button id="csFindPeopleBtn" type="button">Find people</button>
  <button id="csKnownOriginsBtn" type="button">Known origins</button>
</div>
<section id="csIntroductions" class="cs-feed"></section>
<section id="csFeed" class="cs-feed"></section>
<section id="csFederatedFeed" class="cs-feed" hidden></section>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js?v=20260527-knownorigins1"></script>
  <script src="feed_modes.js?v=20260527-discoverorder1"></script>
  <script src="memory_nodes.js?v=20260523-simpleicon1"></script>
  <script src="brand_logo.js?v=20260523-brandlogo1"></script>
  <script src="version_badge.js?v=20260523-version1"></script>
</body>
</html>
