<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Memory Node">
  <defs>
    <linearGradient id="mnStroke" x1="13" y1="13" x2="51" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="55%" stop-color="#34f6ff"/>
      <stop offset="100%" stop-color="#7cffd4"/>
    </linearGradient>
    <radialGradient id="mnGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#34f6ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#34f6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#0b0e17"/>
  <circle cx="32" cy="32" r="30" fill="url(#mnGlow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="2"/>

  <!-- shared node links -->
  <path d="M20 22 L44 22 L32 43 Z"
        fill="none"
        stroke="url(#mnStroke)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".9"/>

  <!-- memory/photo card -->
  <rect x="21" y="25" width="22" height="17" rx="4"
        fill="#111827"
        stroke="url(#mnStroke)"
        stroke-width="2.4"/>

  <path d="M24.5 38 L29.2 33.4 L33 36.7 L36 33.8 L40 38"
        fill="none"
        stroke="#34f6ff"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="37.5" cy="29.5" r="2.2" fill="#ffb84d"/>

  <!-- nodes -->
  <circle cx="20" cy="22" r="5.2" fill="#0b0e17" stroke="#ffb84d" stroke-width="2.6"/>
  <circle cx="44" cy="22" r="5.2" fill="#0b0e17" stroke="#34f6ff" stroke-width="2.6"/>
  <circle cx="32" cy="43" r="5.2" fill="#0b0e17" stroke="#7cffd4" stroke-width="2.6"/>
</svg>
