<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vault">
  <defs>
    <linearGradient id="vaultLockFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Lock body -->
  <rect x="14" y="28" width="36" height="24" rx="6"
        fill="url(#vaultLockFill)"
        stroke="#111827"
        stroke-width="2.5"/>

  <!-- Shackle -->
  <path d="M22 28v-6c0-7 4-12 10-12s10 5 10 12v6"
        fill="none"
        stroke="#111827"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Keyhole -->
  <circle cx="32" cy="39" r="3.5" fill="#fff7ed"/>
  <rect x="30.5" y="42" width="3" height="6" rx="1.5" fill="#fff7ed"/>
</svg>
